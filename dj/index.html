<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DJ Menu – OSTRO Restaurant & Bar 24/7</title>
    <link rel="stylesheet" href="../style.css" />
    <meta name="theme-color" content="#111111" />
    <style>
      .menu-image { display: block; }
      .full-menu {
        display: block;
        width: fit-content;
        margin: 4px auto 28px;
        padding: 12px 22px;
        border-radius: 24px;
        background: #f5c542;
        color: #000;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <header>OSTRO DJ Menu</header>

    <div class="menu-image dj-menu">
      <img src="../images/dj-night-poster-v2.webp" alt="DJ Night Experience" />
      <img
        src="../images/hanuman-4-2-v2.webp"
        loading="lazy"
        alt="Hanuman 4+2 Beer Promotion"
      />
      <img
        src="../images/dj-night-event-menu-v3.webp"
        loading="lazy"
        alt="OSTRO DJ Night Event Menu"
      />
    </div>

    <a class="full-menu" href="../">View full menu</a>
  </body>
</html>
